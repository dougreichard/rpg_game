name: Release Builds

# Triggers on any tag starting with 'v' (e.g. v1.0.0, v0.3.1-beta).
# Can also be run manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for artifacts (e.g. v1.0.0-test)'
        required: true
        default: 'v0.0.0-manual'

# ── Edit this to match your Godot version ───────────────────────────────────
env:
  GODOT_VERSION: "4.6.3"
  PROJECT_NAME: "HunkleBunkle"
# ────────────────────────────────────────────────────────────────────────────

permissions:
  contents: write   # Required to create GitHub Releases.

jobs:
  build:
    name: Export desktop builds
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Godot + templates ──────────────────────────────────────────────────
      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL "${BASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Install export templates
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL "${BASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          # The .tpz contains a 'templates/' folder; rename it to the version path Godot expects.
          cd /tmp && unzip -q templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv /tmp/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      # Godot must scan and import all project resources once before exporting.
      # The .godot/ cache is gitignored so CI always starts cold.
      - name: Import project resources
        run: godot --headless --editor --path . --quit-after 2000 2>&1 || true

      # ── Exports ───────────────────────────────────────────────────────────
      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" \
            "build/windows/${PROJECT_NAME}.exe" 2>&1

      - name: Export Linux
        run: |
          mkdir -p build/linux
          godot --headless --path . --export-release "Linux" \
            "build/linux/${PROJECT_NAME}.x86_64" 2>&1
          chmod +x "build/linux/${PROJECT_NAME}.x86_64"

      - name: Export macOS
        run: |
          mkdir -p build/macos
          # Produces a .zip containing the unsigned .app bundle.
          godot --headless --path . --export-release "macOS" \
            "build/macos/${PROJECT_NAME}.zip" 2>&1

      # ── Determine version tag ──────────────────────────────────────────────
      - name: Set version string
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      # ── Package ───────────────────────────────────────────────────────────
      - name: Package artifacts
        run: |
          TAG=${{ steps.version.outputs.tag }}
          (cd build/windows && zip -r "${GITHUB_WORKSPACE}/${PROJECT_NAME}-${TAG}-Windows.zip" .)
          (cd build/linux   && zip -r "${GITHUB_WORKSPACE}/${PROJECT_NAME}-${TAG}-Linux.zip"   .)
          cp "build/macos/${PROJECT_NAME}.zip" "${PROJECT_NAME}-${TAG}-macOS.zip"

      # ── GitHub Release ────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Hunkle Bunkle ${{ steps.version.outputs.tag }}"
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | Notes |
            |----------|-------|
            | **Windows** | Extract and run `HunkleBunkle.exe` |
            | **Linux** | Extract, then `chmod +x HunkleBunkle.x86_64` and run |
            | **macOS** | Extract the `.zip` to get `HunkleBunkle.app`. First launch: right-click → Open (unsigned build) |

            A web-playable build is deployed to [GitHub Pages](../../deployments/github-pages) on each release.
          files: |
            ${{ env.PROJECT_NAME }}-${{ steps.version.outputs.tag }}-Windows.zip
            ${{ env.PROJECT_NAME }}-${{ steps.version.outputs.tag }}-Linux.zip
            ${{ env.PROJECT_NAME }}-${{ steps.version.outputs.tag }}-macOS.zip
