name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# ── Edit this to match your Godot version ───────────────────────────────────
env:
  GODOT_VERSION: "4.6.3"
  PROJECT_NAME: "HunkleBunkle"
# ────────────────────────────────────────────────────────────────────────────

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy web
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Godot + templates ──────────────────────────────────────────────────
      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget --fail -q "${BASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      - name: Install export templates
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget --fail -q "${BASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O /tmp/templates.tpz
          cd /tmp && unzip -q templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv /tmp/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      # Godot must scan and import all project resources once before exporting.
      - name: Import project resources
        run: godot --headless --editor --path . --quit-after 2000 2>&1 || true

      # ── Web export ────────────────────────────────────────────────────────
      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html 2>&1

      # ── Cross-origin isolation fix ────────────────────────────────────────
      # Godot 4 requires SharedArrayBuffer (for threading), which browsers only
      # allow in a Cross-Origin Isolated context. GitHub Pages can't serve custom
      # HTTP headers, so a service worker shim sets them client-side instead.
      - name: Add cross-origin isolation service worker
        run: |
          wget --fail -q \
            "https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/master/coi-serviceworker.js" \
            -O build/web/coi-serviceworker.js
          sed -i 's|<head>|<head>\n  <script src="coi-serviceworker.js"></script>|' build/web/index.html

      - name: Add .nojekyll
        run: touch build/web/.nojekyll

      # ── Deploy ────────────────────────────────────────────────────────────
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
